services:
  # MSSQL Service
  mssql-server:
    extends:
      file: ./mssql/docker-compose.yaml
      service: sqlserver # This must match the service name inside /mssql/docker-compose.yml
    env_file: .env

  # Postgres Service
  postgres-server:
    extends:
      file: ./postgres/docker-compose.yaml
      service: postgres # This must match the service name inside /postgres/docker-compose.yml
    env_file: .env
    depends_on:
      mssql-server:
        condition: service_healthy

  usermanagement-client:
    extends:
      file: ./user-management/docker-compose.yaml
      service: usermanagement # This must match the service name inside /postgres/docker-compose.yml
    env_file: .env

volumes:
  mssql_data:
  postgres_data:
